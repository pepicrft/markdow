# git-cliff configuration: https://git-cliff.org/docs/configuration

[bump]
initial_tag = "0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = true

[remote.github]
owner = "pepicrft"
repo = "markdow"

[changelog]
header = """
# Markdow changelog
"""
body = """
## What's changed
<!-- RELEASE NOTES START -->
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
  {% if commit.remote.pr_title -%}
    {%- set commit_message = commit.remote.pr_title -%}
  {%- else -%}
    {%- set commit_message = commit.message -%}
  {%- endif -%}
- {{ commit_message | split(pat="\n") | first | trim }}\
  {% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})){% endif %}
{%- endfor %}
{% endfor %}

{% if version and previous.version %}
**Full changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
{% endif %}

{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""
postprocessors = [
  { pattern = '(feat|fix|perf|refactor)(\([^)]*\))?:\s*', replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix\\(release\\)", skip = true },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Improvements" },
  { message = "^(build|chore|ci|docs|style|test)", skip = true },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = "beta|alpha"
ignore_tags = "rc"
topo_order = false
sort_commits = "newest"
