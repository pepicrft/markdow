{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "markdow.fullname" . }}
  labels:
    {{- include "markdow.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "markdow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
{{- end }}
