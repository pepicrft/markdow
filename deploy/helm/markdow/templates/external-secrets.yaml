{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.envSecretName }}
  labels:
    {{- include "markdow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.secrets.envSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MARKDOW_DATABASE_URL: {{ printf "ecto://%s:{{ .%s | urlquery }}@%s/%s" .Values.postgres.user .Values.externalSecrets.postgres.passwordField (include "markdow.postgresHost" .) .Values.postgres.database | quote }}
        {{- range $key, $remoteKey := .Values.externalSecrets.appEnv.fields }}
        {{ $key }}: {{ printf "{{ .%s }}" $remoteKey | quote }}
        {{- end }}
  data:
    - secretKey: {{ .Values.externalSecrets.postgres.passwordField | quote }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.postgres.itemKey .Values.externalSecrets.postgres.passwordField | quote }}
    {{- range $key, $remoteKey := .Values.externalSecrets.appEnv.fields }}
    - secretKey: {{ $remoteKey | quote }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.externalSecrets.appEnv.itemKey $remoteKey | quote }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.appSecretName }}
  labels:
    {{- include "markdow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.postgres.appSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.postgres.user | quote }}
        password: {{ printf "{{ .%s }}" .Values.externalSecrets.postgres.passwordField | quote }}
  data:
    - secretKey: {{ .Values.externalSecrets.postgres.passwordField | quote }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.postgres.itemKey .Values.externalSecrets.postgres.passwordField | quote }}
{{- if .Values.externalSecrets.imagePullSecret.enabled }}
{{- $registry := .Values.externalSecrets.imagePullSecret.registry }}
{{- $usernameField := .Values.externalSecrets.imagePullSecret.usernameField }}
{{- $passwordField := .Values.externalSecrets.imagePullSecret.passwordField }}
{{- $usernameTemplate := printf "{{ .%s }}" $usernameField }}
{{- $passwordTemplate := printf "{{ .%s }}" $passwordField }}
{{- $authTemplate := printf "{{ printf `%%s:%%s` .%s .%s | b64enc }}" $usernameField $passwordField }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.imagePullSecret.name }}
  labels:
    {{- include "markdow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.externalSecrets.imagePullSecret.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ dict "auths" (dict $registry (dict "username" $usernameTemplate "password" $passwordTemplate "auth" $authTemplate)) | toJson | quote }}
  data:
    - secretKey: {{ .Values.externalSecrets.imagePullSecret.usernameField | quote }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.imagePullSecret.itemKey .Values.externalSecrets.imagePullSecret.usernameField | quote }}
    - secretKey: {{ .Values.externalSecrets.imagePullSecret.passwordField | quote }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.imagePullSecret.itemKey .Values.externalSecrets.imagePullSecret.passwordField | quote }}
{{- end }}
{{- end }}
