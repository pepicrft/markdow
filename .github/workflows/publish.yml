name: Publish

on:
  workflow_run:
    workflows: [Markdow]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: markdow-publish
  cancel-in-progress: false

jobs:
  image:
    name: Publish deployable image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: hetzner-docker
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/pepicrft/markdow
          tags: |
            ghcr.io/pepicrft/markdow:main
            ghcr.io/pepicrft/markdow:${{ github.event.workflow_run.head_sha }}
