name: Markdow

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIX_ENV: test

jobs:
  compile:
    name: Compile without warnings
    runs-on: hetzner-docker
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: "erlang elixir"
      - run: mix deps.get
      - run: mix compile --warnings-as-errors

  test:
    name: Test
    runs-on: hetzner-docker
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: "erlang elixir"
      - run: mix deps.get
      - run: mix test

  quokka:
    name: Quokka checks
    runs-on: hetzner-docker
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: "erlang elixir"
      - run: mix deps.get
      - name: Check standard formatting
        run: mix format --check-formatted --dot-formatter .formatter.standard.exs
      - name: Check Quokka formatting
        run: mix format --check-formatted

  chart:
    name: Deployment chart
    runs-on: hetzner-docker
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: "helm"
      - run: helm lint deploy/helm/markdow
      - run: helm lint deploy/helm/markdow --values deploy/values-production.yaml
      - name: Render production deployment
        run: |
          helm template markdow deploy/helm/markdow \
            --namespace markdow \
            --values deploy/values-production.yaml > /tmp/markdow.yaml
          grep -q '^kind: Cluster$' /tmp/markdow.yaml
          grep -q '^kind: ScheduledBackup$' /tmp/markdow.yaml
          grep -q '^kind: ExternalSecret$' /tmp/markdow.yaml
          grep -q '^kind: PersistentVolumeClaim$' /tmp/markdow.yaml

  container:
    name: Container build
    runs-on: hetzner-docker
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: markdow:check

  release_check:
    name: Check for releasable changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [compile, test, quokka, chart, container]
    runs-on: hetzner-docker
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      next-version: ${{ steps.check.outputs.next-version }}
      next-version-number: ${{ steps.check.outputs.next-version-number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install_args: git-cliff
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec git-cliff -- ./mise/tasks/release/check.sh

  release:
    name: Release Markdow
    needs: release_check
    if: needs.release_check.outputs.should-release == 'true'
    runs-on: hetzner-docker
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install_args: "git-cliff helm"

      - name: Generate release notes
        id: release-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ needs.release_check.outputs.next-version }}
        run: |
          latest_version=$(git tag --list 'v[0-9]*' | sort -V | tail -n1)
          echo 'notes<<EOF' >> "$GITHUB_OUTPUT"
          if [ -n "$latest_version" ]; then
            git cliff --config cliff.toml --repository . --tag "$NEXT_VERSION" -- "$latest_version..HEAD" 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,/<!-- generated by git-cliff -->/p' | tail -n +2 | sed '$d' >> "$GITHUB_OUTPUT"
          else
            git cliff --config cliff.toml --repository . --tag "$NEXT_VERSION" 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,/<!-- generated by git-cliff -->/p' | tail -n +2 | sed '$d' >> "$GITHUB_OUTPUT"
          fi
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/pepicrft/markdow
            org.opencontainers.image.version=${{ needs.release_check.outputs.next-version-number }}
          tags: |
            ghcr.io/pepicrft/markdow:${{ needs.release_check.outputs.next-version-number }}
            ghcr.io/pepicrft/markdow:latest
            ghcr.io/pepicrft/markdow:main

      - name: Package Helm chart
        env:
          VERSION: ${{ needs.release_check.outputs.next-version-number }}
        run: helm package deploy/helm/markdow --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Publish Helm chart
        env:
          VERSION: ${{ needs.release_check.outputs.next-version-number }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/markdow-${VERSION}.tgz" oci://ghcr.io/pepicrft/charts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          target_commitish: ${{ github.sha }}
          name: ${{ needs.release_check.outputs.next-version-number }}
          tag_name: ${{ needs.release_check.outputs.next-version }}
          body: |
            Container image: [`ghcr.io/pepicrft/markdow:${{ needs.release_check.outputs.next-version-number }}`](https://github.com/users/pepicrft/packages/container/package/markdow)

            Helm chart: [`oci://ghcr.io/pepicrft/charts/markdow`](https://github.com/users/pepicrft/packages/container/package/charts%2Fmarkdow)

            ${{ steps.release-notes.outputs.notes }}
